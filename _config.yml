# Site settings
title: Md Nazmul Hasan
tagline: Software Engineer
description: >-
  Personal blog of Md Nazmul Hasan — notes on backend engineering, Web3,
  system design and cloud.
author:
  name: Md Nazmul Hasan
  email: hasan08sust@gmail.com

# Change to "https://yourdomain.com" once your custom domain is set up
url: "https://farhapartex.github.io"
baseurl: ""
timezone: Asia/Dhaka
lang: en

# Links shown in the footer (leave empty to hide)
social:
  github: farhapartex
  linkedin: # your LinkedIn username
  twitter: # your Twitter/X username
  email: hasan08sust@gmail.com

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
